<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Normal browser tab icon -->
<link rel="icon" type="image/jpg" href="brushstroke.icon">

<!-- iPhone/iOS home screen icon -->
<link rel="apple-touch-icon" href="brushstroke.icon">

<!-- Android/Chrome home screen icon (PWA) -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="brushstroke.css">
</head>
<body>
    <!-- LOGIN SECTION (shown first) -->
  <div class="login-card" id="loginSection">
    <div class="brand">Brushstrokes</div>
    <span class="brush-underline"></span>
    <h1>Login</h1>
    <form id="loginForm">
      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="username" required>
 
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>
 
      <button type="submit">Login</button>
      <div id="message"></div>
    </form>
  </div>
 
  <!-- DASHBOARD / ATTENDANCE SECTION (hidden until login succeeds) -->
  <div class="page hidden" id="dashboardSection">
    <div class="brand">Brushstrokes</div>
 
    <!-- Date picker: shows dd/mm/yy, click opens native calendar -->
    <div class="date-row">
      <button id="dateBtn" type="button" class="date-box">01/01/26</button>
      <input type="date" id="dateInput" class="date-input-hidden">
    </div>
 
    <button id="attendanceBtn" class="attendance-box">Attendance</button>
 
    <div id="attendanceSection" class="attendance-section hidden">
      <table id="attendanceTable">
        <thead>
          <tr>
            <th>Student</th>
            <th>Present</th>
            <th>Absent</th>
          </tr>
        </thead>
        <tbody id="attendanceBody"></tbody>
      </table>
 
      <button id="saveBtn" class="save-btn">Save Data</button>
 
      <div id="saveDataBox" class="save-data-box hidden">
        <h3 id="saveDataTitle">Save Data</h3>
        <p><strong>Present:</strong> <span id="presentList">-</span></p>
        <p><strong>Absent:</strong> <span id="absentList">-</span></p>
      </div>
    </div>
  </div>
    
</script>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
</script>
<script src="brushstroke.js"></script>
</body>
</html>
